<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Omega Doors Quotation Builder</title>
    <meta name="description" content="Mobile quotation generator for Omega Doors Industries UPVC windows and APL Apollo systems with 5-page PDF export." />
    <meta property="og:title" content="Omega Doors Quotation Builder" />
    <meta property="og:description" content="Mobile quotation generator for Omega Doors Industries UPVC windows and APL Apollo systems with 5-page PDF export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Omega Quote" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-600 selection:text-white">
    <div id="root"></div>
    <div id="loading-screen" class="fixed inset-0 bg-slate-50 flex items-center justify-center z-50">
      <div class="flex flex-col items-center gap-4">
        <img
          src="/assets/quotation/omega-logo.jpg"
          alt="Omega Doors"
          class="w-32 h-32 object-contain animate-pulse"
        />
        <p class="text-sm font-medium text-slate-600">Loading...</p>
      </div>
    </div>
    <script>
      window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          setTimeout(() => {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.3s ease';
            setTimeout(() => loadingScreen.remove(), 300);
          }, 1000);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
