name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build
          rm -rf dist/assets/aistudio dist/*.zip

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Capacitor & add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Omega Doors Quotation" com.omegadoors.quotation --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Doors-Quotation-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
